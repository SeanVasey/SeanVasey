name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli@0.49.1 "**/*.md"

      - name: README link check
        run: npx --yes markdown-link-check@3.15.0 --config .markdown-link-check.json README.md
