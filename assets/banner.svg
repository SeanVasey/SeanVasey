<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">studio/VASEY — Sean Vasey</title>
  <desc id="desc">A restrained near-black VASEY banner with cyan grid lines, signal traces, and labels for VASEY/DEV, VASEY/AI, VASEY.AUDIO, and Vasey Multimedia.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020305" />
      <stop offset="0.56" stop-color="#05070A" />
      <stop offset="1" stop-color="#021018" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1000 164) rotate(180) scale(430 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#00BCE6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="82" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00BCE6" />
      <stop offset="0.55" stop-color="#00D4FF" />
      <stop offset="1" stop-color="#009CFF" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#00BCE6" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="8" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="faintNoise">
        <feFuncA type="table" tableValues="0 0.035" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="screen" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)" filter="url(#grain)">
    <rect width="1200" height="340" fill="url(#background)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    <rect width="1200" height="340" fill="url(#cyanGlow)" />

    <path d="M0 2H1200" stroke="url(#accent)" stroke-width="3" />
    <path d="M0 338H1200" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2" />

    <g opacity="0.42" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M775 91h86l23-23h96l26 26h111" stroke="#00BCE6" stroke-width="1.25" />
      <path d="M718 252h106l25-25h89l32 32h182" stroke="#009CFF" stroke-width="1.25" />
      <path d="M815 166h40l12-28 18 58 22-86 24 112 18-67 18 32 15-21h170" stroke="#00D4FF" stroke-width="2" filter="url(#softGlow)" />
      <circle cx="884" cy="68" r="4" fill="#00D4FF" stroke="none" />
      <circle cx="1006" cy="94" r="4" fill="#00BCE6" stroke="none" />
      <circle cx="849" cy="227" r="4" fill="#009CFF" stroke="none" />
      <circle cx="970" cy="259" r="4" fill="#00D4FF" stroke="none" />
    </g>

    <g transform="translate(82 57)">
      <text fill="#00D4FF" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="15" font-weight="700" letter-spacing="4">studio/VASEY</text>
      <rect y="34" width="78" height="2" rx="1" fill="url(#accent)" />

      <text y="118" fill="#F0F4F8" font-family="'Bebas Neue', 'Arial Narrow', sans-serif" font-size="78" font-weight="700" letter-spacing="2">SEAN VASEY</text>
      <text y="158" fill="#F0F4F8" fill-opacity="0.66" font-family="'Reddit Sans', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1.8">CREATIVE TECHNOLOGIST  //  FULL-STACK PRODUCT BUILDER</text>

      <g transform="translate(0 203)" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.4">
        <text fill="#00D4FF">VASEY/DEV</text>
        <text x="112" fill="#F0F4F8" fill-opacity="0.34">//</text>
        <text x="143" fill="#F0F4F8" fill-opacity="0.72">VASEY/AI</text>
        <text x="241" fill="#F0F4F8" fill-opacity="0.34">//</text>
        <text x="272" fill="#F0F4F8" fill-opacity="0.72">VASEY.AUDIO</text>
        <text x="397" fill="#F0F4F8" fill-opacity="0.34">//</text>
        <text x="428" fill="#F0F4F8" fill-opacity="0.72">VASEY MULTIMEDIA</text>
      </g>
    </g>

    <text x="1118" y="309" text-anchor="end" fill="#F0F4F8" fill-opacity="0.35" font-family="'Space Mono', 'JetBrains Mono', monospace" font-size="11" letter-spacing="2.4">CODE × COMPOSITION × CULTURE</text>
  </g>
</svg>
