<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="styleyes-title styleyes-desc">
  <title id="styleyes-title">StyleyeS vivid prompt engineering interface preview</title>
  <desc id="styleyes-desc">A faithful preview of StyleyeS with its orange-crimson-violet identity, text input, image model selection, aspect ratio control, art-style picker, recipe stack, and generated prompt panel.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00FFFF"/><stop offset="1" stop-color="#009CFF"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF6B35"/><stop offset=".5" stop-color="#DC2F5A"/><stop offset="1" stop-color="#9B4DCA"/></linearGradient>
    <radialGradient id="warmGlow" cx="20%" cy="10%" r="80%"><stop stop-color="#FF6B35" stop-opacity=".16"/><stop offset=".46" stop-color="#DC2F5A" stop-opacity=".04"/><stop offset="1" stop-color="#0F1419" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetGlow" cx="85%" cy="88%" r="72%"><stop stop-color="#9B4DCA" stop-opacity=".13"/><stop offset="1" stop-color="#0F1419" stop-opacity="0"/></radialGradient>
    <clipPath id="viewportClip"><rect x="24" y="82" width="1232" height="614" rx="22"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="#101214"/>
  <rect x="24" y="18" width="1232" height="52" rx="16" fill="#15191D" stroke="url(#frame)" stroke-opacity=".8"/>
  <circle cx="50" cy="44" r="5" fill="#00FFFF"/>
  <text x="68" y="50" fill="#EAFBFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">VASEY/DEV</text>
  <text x="1228" y="50" text-anchor="end" fill="#73909B" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">APPLICATION PREVIEW</text>

  <g clip-path="url(#viewportClip)">
    <rect x="24" y="82" width="1232" height="614" fill="#0F1419"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#warmGlow)"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#violetGlow)"/>

    <g transform="translate(220 99)">
      <text x="420" y="12" text-anchor="middle" fill="#8B98A5" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4">VASEY/AI PRESENTS</text>
      <g transform="translate(267 25)">
        <rect width="58" height="58" rx="16" fill="#1A1F25" stroke="url(#brand)" stroke-width="2"/>
        <path d="M9 30c10-16 30-16 40 0-10 16-30 16-40 0Z" fill="none" stroke="url(#brand)" stroke-width="3"/>
        <circle cx="29" cy="30" r="8" fill="url(#brand)"/>
        <circle cx="32" cy="27" r="2.5" fill="#FFFFFF" fill-opacity=".8"/>
      </g>
      <text x="344" y="70" fill="#E7E9EA" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Styleye<tspan fill="url(#brand)">S</tspan></text>
      <text x="420" y="98" text-anchor="middle" fill="#8B98A5" font-family="Inter, Arial, sans-serif" font-size="15">The vivid prompt engineering studio.</text>

      <g transform="translate(0 126)">
        <rect width="840" height="488" rx="20" fill="#1A1F25" fill-opacity=".62" stroke="#FFFFFF" stroke-opacity=".08"/>

        <g transform="translate(22 20)">
          <rect width="390" height="156" rx="14" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <text x="0" y="-7" fill="#8B98A5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Input Mode</text>
          <g transform="translate(248 -15)" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">
            <rect width="142" height="32" rx="16" fill="#242B33"/>
            <rect x="3" y="3" width="67" height="26" rx="13" fill="url(#brand)"/>
            <text x="36" y="21" fill="#FFFFFF" font-weight="700">Text</text><text x="106" y="21" fill="#8B98A5">Image</text>
          </g>
          <text x="18" y="38" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="13">A lone astronaut on Mars, surveying</text>
          <text x="18" y="61" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="13">the rust-red landscape as dual moons</text>
          <text x="18" y="84" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="13">rise above the horizon…</text>
          <line x1="18" y1="118" x2="372" y2="118" stroke="#FFFFFF" stroke-opacity=".06"/>
          <text x="18" y="140" fill="#536471" font-family="monospace" font-size="10">0 / 2000</text>
        </g>

        <g transform="translate(428 20)">
          <text x="0" y="-7" fill="#8B98A5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Target Model</text>
          <rect width="390" height="58" rx="13" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <circle cx="31" cy="29" r="14" fill="#242B33" stroke="#9B4DCA" stroke-opacity=".55"/>
          <path d="M24 31c4-6 10-6 14 0M31 20v18" fill="none" stroke="#E7E9EA" stroke-width="1.5"/>
          <text x="58" y="26" fill="#E7E9EA" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Nano Banana Pro</text>
          <text x="58" y="43" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="10">High-resolution image generation and editing</text>
          <path d="m360 25 7 7 7-7" fill="none" stroke="#8B98A5" stroke-width="1.6"/>

          <text x="0" y="89" fill="#8B98A5" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Aspect Ratio</text>
          <rect y="101" width="390" height="91" rx="13" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <text x="16" y="124" fill="#E7E9EA" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Image Size</text>
          <rect x="310" y="112" width="36" height="36" rx="7" fill="#242B33" stroke="#DC2F5A" stroke-opacity=".5"/>
          <rect x="317" y="119" width="22" height="22" rx="4" fill="url(#brand)" fill-opacity=".35" stroke="#DC2F5A"/>
          <g transform="translate(17 142)" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle"><text x="45" y="0" fill="#8B98A5">Portrait</text><text x="176" y="0" fill="#E7E9EA" font-weight="700">Square</text><text x="309" y="0" fill="#8B98A5">Landscape</text></g>
          <rect x="17" y="159" width="356" height="5" rx="2.5" fill="#242B33"/>
          <rect x="17" y="159" width="178" height="5" rx="2.5" fill="url(#brand)"/>
          <circle cx="195" cy="161.5" r="9" fill="#E7E9EA" stroke="#DC2F5A" stroke-width="3"/>
          <text x="195" y="185" text-anchor="middle" fill="#E7E9EA" font-family="monospace" font-size="11">1:1</text>
        </g>

        <g transform="translate(22 215)">
          <rect width="796" height="185" rx="14" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">
            <rect x="12" y="12" width="378" height="38" rx="10" fill="url(#brand)" fill-opacity=".18" stroke="#DC2F5A" stroke-opacity=".45"/>
            <text x="201" y="36" fill="#E7E9EA" text-anchor="middle">✦ Art Styles</text>
            <rect x="406" y="12" width="378" height="38" rx="10" fill="#242B33"/>
            <text x="595" y="36" fill="#8B98A5" text-anchor="middle">◉ Lighting &amp; WB</text>
          </g>
          <g transform="translate(16 64)" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">
            <rect width="62" height="29" rx="14.5" fill="url(#brand)"/><text x="31" y="19" fill="#FFFFFF" font-weight="700">Photo</text>
            <rect x="70" width="78" height="29" rx="14.5" fill="#242B33"/><text x="109" y="19" fill="#8B98A5">Cinematic</text>
            <rect x="156" width="52" height="29" rx="14.5" fill="#242B33"/><text x="182" y="19" fill="#8B98A5">Art</text>
            <rect x="216" width="62" height="29" rx="14.5" fill="#242B33"/><text x="247" y="19" fill="#8B98A5">Digital</text>
            <rect x="286" width="58" height="29" rx="14.5" fill="#242B33"/><text x="315" y="19" fill="#8B98A5">Mood</text>
            <rect x="352" width="64" height="29" rx="14.5" fill="#242B33"/><text x="384" y="19" fill="#8B98A5">Texture</text>
          </g>
          <g transform="translate(16 105)" font-family="Inter, Arial, sans-serif">
            <g><rect width="180" height="62" rx="11" fill="#202A33" stroke="#FFFFFF" stroke-opacity=".08"/><rect width="6" height="62" rx="3" fill="#34495E"/><text x="18" y="27" fill="#E7E9EA" font-size="12" font-weight="700">Raw Realism</text><text x="18" y="46" fill="#536471" font-size="10">natural · documentary</text></g>
            <g transform="translate(194 0)"><rect width="180" height="62" rx="11" fill="#18181D" stroke="#FFFFFF" stroke-opacity=".08"/><rect width="6" height="62" rx="3" fill="#4A4A4A"/><text x="18" y="27" fill="#E7E9EA" font-size="12" font-weight="700">Street Documentary</text><text x="18" y="46" fill="#536471" font-size="10">candid · high contrast</text></g>
            <g transform="translate(388 0)"><rect width="180" height="62" rx="11" fill="#1C202B" stroke="#FFFFFF" stroke-opacity=".08"/><rect width="6" height="62" rx="3" fill="#4A4A6A"/><text x="18" y="27" fill="#E7E9EA" font-size="12" font-weight="700">Studio Portrait</text><text x="18" y="46" fill="#536471" font-size="10">softbox · shallow DOF</text></g>
            <g transform="translate(582 0)"><rect width="182" height="62" rx="11" fill="#20252B" stroke="#FFFFFF" stroke-opacity=".08"/><rect width="6" height="62" rx="3" fill="#78909C"/><text x="18" y="27" fill="#E7E9EA" font-size="12" font-weight="700">Architecture</text><text x="18" y="46" fill="#536471" font-size="10">symmetry · clean lines</text></g>
          </g>
        </g>

        <g transform="translate(22 420)">
          <rect width="390" height="52" rx="12" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <text x="15" y="22" fill="#E7E9EA" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Recipe Stack</text>
          <text x="374" y="22" text-anchor="end" fill="#536471" font-family="monospace" font-size="10">0 / 8</text>
          <text x="195" y="42" text-anchor="middle" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="10">Tap styles or lighting to build your recipe</text>
          <rect x="406" width="390" height="52" rx="12" fill="#1A1F25" stroke="#FFFFFF" stroke-opacity=".08"/>
          <text x="421" y="22" fill="#E7E9EA" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Generated Prompt</text>
          <text x="421" y="42" fill="#536471" font-family="Inter, Arial, sans-serif" font-size="10">Your vivid prompt will appear here…</text>
          <rect x="719" y="11" width="64" height="30" rx="9" fill="url(#brand)"/>
          <text x="751" y="30" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Copy</text>
        </g>
      </g>
    </g>
  </g>
  <rect x="24" y="82" width="1232" height="614" rx="22" fill="none" stroke="url(#frame)" stroke-opacity=".42" stroke-width="2"/>
</svg>
