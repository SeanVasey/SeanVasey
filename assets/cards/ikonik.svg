<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ikonik-title ikonik-desc">
  <title id="ikonik-title">IkoniK vector graphics studio interface preview</title>
  <desc id="ikonik-desc">A faithful desktop preview of the IkoniK studio with its violet identity, upload workspace, supported image formats, model selector, conversion pipeline, and SVG actions.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00FFFF"/><stop offset="1" stop-color="#009CFF"/></linearGradient>
    <linearGradient id="ikGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#7C5CFC"/><stop offset="1" stop-color="#5B3FD9"/></linearGradient>
    <radialGradient id="violetGlow" cx="50%" cy="18%" r="66%"><stop stop-color="#7C5CFC" stop-opacity=".18"/><stop offset=".55" stop-color="#7C5CFC" stop-opacity=".035"/><stop offset="1" stop-color="#0A0E14" stop-opacity="0"/></radialGradient>
    <pattern id="checkers" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#FFFFFF"/><path d="M0 0h10v10H0zM10 10h10v10H10z" fill="#E5E5E5"/></pattern>
    <clipPath id="viewportClip"><rect x="24" y="82" width="1232" height="614" rx="22"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="#101214"/>
  <rect x="24" y="18" width="1232" height="52" rx="16" fill="#15191D" stroke="url(#frame)" stroke-opacity=".8"/>
  <circle cx="50" cy="44" r="5" fill="#00FFFF"/>
  <text x="68" y="50" fill="#EAFBFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">VASEY/DEV</text>
  <text x="1228" y="50" text-anchor="end" fill="#73909B" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">APPLICATION PREVIEW</text>

  <g clip-path="url(#viewportClip)">
    <rect x="24" y="82" width="1232" height="614" fill="#0A0E14"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#violetGlow)"/>

    <rect x="24" y="82" width="1232" height="64" fill="#141A22" fill-opacity=".84" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="55" y="120" fill="#5A6370" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">VASEY/AI</text>
    <line x1="136" y1="103" x2="136" y2="127" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="153" y="124" fill="#F0F2F5" font-family="Arial Narrow, Inter, sans-serif" font-size="28" font-weight="800" letter-spacing="1">Ikoni<tspan fill="#7C5CFC">K</tspan></text>
    <g transform="translate(514 94)" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">
      <text x="45" y="27" fill="#F0F2F5" font-weight="600">Studio</text><rect x="23" y="46" width="44" height="2.5" rx="1.25" fill="#7C5CFC"/>
      <text x="151" y="27" fill="#8A94A0">Design</text><rect x="180" y="9" width="78" height="22" rx="11" fill="#1E2630"/><text x="219" y="24" fill="#5A6370" font-size="10">Coming Soon</text>
    </g>
    <g transform="translate(918 95)" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">
      <rect width="292" height="40" rx="10" fill="#141A22" fill-opacity=".75" stroke="#FFFFFF" stroke-opacity=".08"/>
      <rect x="98" y="3" width="94" height="34" rx="8" fill="#7C5CFC"/>
      <text x="49" y="24" fill="#8A94A0">Fable 5</text><text x="145" y="24" fill="#FFFFFF" font-weight="700">Opus 4.8</text><text x="242" y="24" fill="#8A94A0">Sonnet 4.6</text>
    </g>

    <g transform="translate(64 172)">
      <g transform="translate(0 0)">
        <text x="0" y="15" fill="#8A94A0" font-family="Arial Narrow, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">UPLOAD</text>
        <line x1="78" y1="10" x2="770" y2="10" stroke="#FFFFFF" stroke-opacity=".08"/>
        <rect x="0" y="34" width="790" height="424" rx="16" fill="#141A22" fill-opacity=".7" stroke="#FFFFFF" stroke-opacity=".08"/>
        <rect x="1" y="35" width="788" height="422" rx="15" fill="url(#violetGlow)" opacity=".8"/>

        <g transform="translate(337 92)" fill="none" stroke="#7C5CFC" stroke-width="2">
          <path d="M58 4v80M32 31 58 4l26 27" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 61v31a12 12 0 0 0 12 12h72a12 12 0 0 0 12-12V61" stroke-linecap="round"/>
        </g>
        <text x="395" y="241" fill="#F0F2F5" font-family="Arial Narrow, Inter, sans-serif" font-size="31" font-weight="800" text-anchor="middle" letter-spacing="1.5">DRAG &amp; DROP IMAGE</text>
        <text x="395" y="270" fill="#8A94A0" font-family="Inter, Arial, sans-serif" font-size="14" text-anchor="middle">or tap to browse</text>
        <g transform="translate(240 296)" font-family="monospace" font-size="11" text-anchor="middle">
          <rect width="64" height="30" rx="15" fill="#1E2630" stroke="#FFFFFF" stroke-opacity=".08"/><text x="32" y="20" fill="#8A94A0">PNG</text>
          <rect x="74" width="70" height="30" rx="15" fill="#1E2630" stroke="#FFFFFF" stroke-opacity=".08"/><text x="109" y="20" fill="#8A94A0">JPEG</text>
          <rect x="154" width="72" height="30" rx="15" fill="#1E2630" stroke="#FFFFFF" stroke-opacity=".08"/><text x="190" y="20" fill="#8A94A0">WEBP</text>
          <rect x="236" width="64" height="30" rx="15" fill="#1E2630" stroke="#FFFFFF" stroke-opacity=".08"/><text x="268" y="20" fill="#8A94A0">GIF</text>
          <text x="339" y="20" fill="#5A6370">≤ 10 MB</text>
        </g>
        <g transform="translate(205 362)" font-family="Inter, Arial, sans-serif" font-size="12">
          <rect width="380" height="52" rx="12" fill="#0A0E14" fill-opacity=".52" stroke="#7C5CFC" stroke-opacity=".22"/>
          <path d="M24 26h20M34 16v20" stroke="#A78BFA" stroke-width="1.5"/>
          <text x="58" y="24" fill="#F0F2F5">Upload an image to begin</text>
          <text x="58" y="40" fill="#5A6370">Files are previewed locally before analysis.</text>
        </g>
      </g>

      <g transform="translate(816 0)">
        <rect x="0" y="0" width="328" height="458" rx="16" fill="#141A22" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".08"/>
        <text x="22" y="34" fill="#8A94A0" font-family="Arial Narrow, Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">CONVERT</text>
        <line x1="112" y1="29" x2="306" y2="29" stroke="#FFFFFF" stroke-opacity=".08"/>
        <text x="22" y="72" fill="#5A6370" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">PIPELINE</text>
        <g transform="translate(26 91)" font-family="Inter, Arial, sans-serif" font-size="12">
          <circle cx="10" cy="10" r="9" fill="#1E2630" stroke="#5A6370"/><text x="10" y="14" text-anchor="middle" fill="#8A94A0">1</text><text x="34" y="14" fill="#8A94A0">Upload</text>
          <line x1="10" y1="21" x2="10" y2="51" stroke="#FFFFFF" stroke-opacity=".09"/>
          <circle cx="10" cy="62" r="9" fill="#1E2630" stroke="#5A6370"/><text x="10" y="66" text-anchor="middle" fill="#8A94A0">2</text><text x="34" y="66" fill="#8A94A0">Analyze</text>
          <line x1="10" y1="73" x2="10" y2="103" stroke="#FFFFFF" stroke-opacity=".09"/>
          <circle cx="10" cy="114" r="9" fill="#1E2630" stroke="#5A6370"/><text x="10" y="118" text-anchor="middle" fill="#8A94A0">3</text><text x="34" y="118" fill="#8A94A0">Convert</text>
        </g>
        <line x1="22" y1="245" x2="306" y2="245" stroke="#FFFFFF" stroke-opacity=".08"/>
        <text x="22" y="276" fill="#5A6370" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">OUTPUT</text>
        <rect x="22" y="294" width="284" height="50" rx="10" fill="#7C5CFC" opacity=".4"/>
        <text x="164" y="325" fill="#FFFFFF" fill-opacity=".6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Analyze Image</text>
        <rect x="22" y="355" width="284" height="50" rx="10" fill="#7C5CFC" fill-opacity=".1" stroke="#7C5CFC" stroke-opacity=".4"/>
        <text x="164" y="386" fill="#A78BFA" fill-opacity=".55" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Convert to SVG</text>
        <text x="164" y="430" fill="#5A6370" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle">Upload a source image to activate</text>
      </g>
    </g>

    <rect x="64" y="658" width="1144" height="1" fill="#7C5CFC" opacity=".18"/>
    <text x="64" y="683" fill="#5A6370" font-family="Inter, Arial, sans-serif" font-size="11" letter-spacing="2">CLAUDE-POWERED VECTOR GRAPHICS STUDIO</text>
    <g transform="translate(1145 666)"><rect width="22" height="22" rx="5" fill="url(#checkers)"/><path d="M6 16 11 5l5 11" fill="none" stroke="#7C5CFC" stroke-width="2"/></g>
  </g>
  <rect x="24" y="82" width="1232" height="614" rx="22" fill="none" stroke="url(#frame)" stroke-opacity=".42" stroke-width="2"/>
</svg>
