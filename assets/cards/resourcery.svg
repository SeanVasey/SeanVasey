<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="resourcery-title resourcery-desc">
  <title id="resourcery-title">reSOURCERY media audio extraction interface preview</title>
  <desc id="resourcery-desc">A faithful dark glass preview of reSOURCERY with its indigo-to-cyan identity, media URL field, file drop zone, supported media formats, and extraction action.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00FFFF"/>
      <stop offset="1" stop-color="#009CFF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5568CC"/>
      <stop offset=".52" stop-color="#4DD8C8"/>
      <stop offset="1" stop-color="#5CE6D6"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4455AA"/>
      <stop offset="1" stop-color="#4DD8C8"/>
    </linearGradient>
    <radialGradient id="indigoGlow" cx="14%" cy="8%" r="78%">
      <stop stop-color="#4455AA" stop-opacity=".24"/>
      <stop offset=".58" stop-color="#08080C" stop-opacity=".03"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="88%" cy="94%" r="76%">
      <stop stop-color="#4DD8C8" stop-opacity=".17"/>
      <stop offset="1" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#FFFFFF" stroke-opacity=".018"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="viewportClip"><rect x="24" y="82" width="1232" height="614" rx="22"/></clipPath>
  </defs>

  <rect width="1280" height="720" fill="#101214"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="24" y="18" width="1232" height="52" rx="16" fill="#15191D" stroke="url(#frame)" stroke-opacity=".8"/>
  <circle cx="50" cy="44" r="5" fill="#00FFFF"/>
  <text x="68" y="50" fill="#EAFBFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">VASEY/DEV</text>
  <text x="1228" y="50" text-anchor="end" fill="#73909B" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">APPLICATION PREVIEW</text>

  <g clip-path="url(#viewportClip)">
    <rect x="24" y="82" width="1232" height="614" fill="#050508"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#indigoGlow)"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#cyanGlow)"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#grid)" opacity=".65"/>

    <circle cx="207" cy="178" r="62" fill="#4455AA" opacity=".08" filter="url(#glow)"/>
    <circle cx="1075" cy="592" r="76" fill="#4DD8C8" opacity=".07" filter="url(#glow)"/>

    <g transform="translate(1182 106)">
      <rect width="42" height="42" rx="13" fill="#111119" fill-opacity=".82" stroke="#FFFFFF" stroke-opacity=".1"/>
      <path d="M13 15h16M13 21h16M13 27h16" fill="none" stroke="#8E95A8" stroke-width="1.7" stroke-linecap="round"/>
    </g>

    <g transform="translate(290 98)">
      <text x="350" y="12" text-anchor="middle" fill="#73798D" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="4.2">VASEY/AI PRESENTS</text>

      <g transform="translate(138 28)">
        <circle cx="38" cy="38" r="37" fill="#0D0D15" stroke="#4DD8C8" stroke-opacity=".42"/>
        <circle cx="38" cy="38" r="29" fill="#4455AA" fill-opacity=".13"/>
        <path d="M17 45 30 20l28 25c-12-5-28-5-41 0Z" fill="#4455AA" fill-opacity=".72" stroke="#5CE6D6" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M22 48c10-4 23-4 33 0" fill="none" stroke="#5CE6D6" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M46 28v16.5c0 4-3 6.5-6.5 6.5-3 0-5.5-1.8-5.5-4.3 0-2.8 2.5-4.7 5.8-4.7 1.4 0 2.6.3 3.6.8V31l10-2.6v12.1c0 4-3 6.5-6.5 6.5" fill="none" stroke="#E7FFFC" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="27" r="1.7" fill="#5CE6D6"/>
        <circle cx="57" cy="19" r="1.4" fill="#5CE6D6"/>
      </g>

      <text x="230" y="82" fill="#EAF1F2" font-family="Inter, Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="-.8">re</text>
      <text x="278" y="82" fill="url(#brand)" font-family="Inter, Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="-.8">SOURCERY</text>
      <text x="350" y="110" text-anchor="middle" fill="#8E95A8" font-family="Inter, Arial, sans-serif" font-size="14">Extract the magic from your media.</text>

      <g transform="translate(50 137)">
        <rect width="600" height="440" rx="23" fill="#0D0D15" fill-opacity=".76" stroke="#FFFFFF" stroke-opacity=".09"/>
        <rect x="1" y="1" width="598" height="438" rx="22" fill="none" stroke="url(#brand)" stroke-opacity=".12"/>

        <text x="28" y="38" fill="#EAF1F2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.2">EXTRACT AUDIO</text>
        <text x="28" y="61" fill="#73798D" font-family="Inter, Arial, sans-serif" font-size="12">Drop media or enter a URL to begin</text>

        <g transform="translate(28 82)">
          <rect width="544" height="60" rx="14" fill="#111119" fill-opacity=".9" stroke="#FFFFFF" stroke-opacity=".11"/>
          <path d="M19 31c0-5 3.7-8.5 8.5-8.5h5.2M38 22.5h2.5c4.8 0 8.5 3.5 8.5 8.5s-3.7 8.5-8.5 8.5H35M32.5 39.5H30c-4.8 0-8.5-3.5-8.5-8.5M29 31h12" fill="none" stroke="#4DD8C8" stroke-width="1.7" stroke-linecap="round"/>
          <text x="62" y="36" fill="#5F667A" font-family="Inter, Arial, sans-serif" font-size="13">Paste media URL here…</text>
          <rect x="492" y="8" width="44" height="44" rx="12" fill="url(#button)"/>
          <path d="M507 30h14m-5-5 5 5-5 5" fill="none" stroke="#F5FFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g transform="translate(28 162)">
          <rect width="544" height="226" rx="18" fill="#0A0A10" fill-opacity=".78" stroke="#4DD8C8" stroke-opacity=".26" stroke-dasharray="6 7"/>
          <circle cx="272" cy="64" r="31" fill="#4DD8C8" fill-opacity=".08" stroke="#4DD8C8" stroke-opacity=".28"/>
          <path d="M272 75V51m-9 9 9-9 9 9M260 76h24" fill="none" stroke="#5CE6D6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="272" y="119" text-anchor="middle" fill="#EAF1F2" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Drag &amp; drop media file</text>
          <text x="272" y="141" text-anchor="middle" fill="#73798D" font-family="Inter, Arial, sans-serif" font-size="12">or click to browse</text>

          <g transform="translate(82 166)" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">
            <g><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">MP4</text></g>
            <g transform="translate(48)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">MOV</text></g>
            <g transform="translate(96)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">AVI</text></g>
            <g transform="translate(144)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">MKV</text></g>
            <g transform="translate(192)"><rect width="52" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="26" y="17" fill="#8E95A8">WEBM</text></g>
            <g transform="translate(250)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">MP3</text></g>
            <g transform="translate(298)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">WAV</text></g>
            <g transform="translate(346)"><rect width="42" height="25" rx="7" fill="#111119" stroke="#FFFFFF" stroke-opacity=".08"/><text x="21" y="17" fill="#8E95A8">M4A</text></g>
          </g>
        </g>

        <g transform="translate(28 409)">
          <circle cx="6" cy="6" r="3" fill="#4DD8C8"/>
          <text x="18" y="10" fill="#73798D" font-family="Inter, Arial, sans-serif" font-size="10" letter-spacing=".4">VIDEO · AUDIO · URL</text>
          <text x="544" y="10" text-anchor="end" fill="#4DD8C8" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">READY</text>
        </g>
      </g>
    </g>
  </g>

  <rect x="24" y="82" width="1232" height="614" rx="22" fill="none" stroke="url(#frame)" stroke-opacity=".58"/>
</svg>
