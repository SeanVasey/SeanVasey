<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="pagex-title pagex-desc">
  <title id="pagex-title">PAGE•X page extraction interface preview</title>
  <desc id="pagex-desc">A faithful dark interface preview of PAGE•X with its client-side status strip, media upload zone, PDF and DOCX output controls, and cyan VASEY/AI visual language.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00FFFF"/><stop offset="1" stop-color="#009CFF"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F4F8FC"/><stop offset="1" stop-color="#B9C6D4"/></linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="5%" r="75%"><stop stop-color="#00C8F0" stop-opacity=".13"/><stop offset=".54" stop-color="#00C8F0" stop-opacity=".025"/><stop offset="1" stop-color="#0A0E14" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#00C8F0" stroke-opacity=".025"/></pattern>
    <clipPath id="viewportClip"><rect x="24" y="82" width="1232" height="614" rx="22"/></clipPath>
    <filter id="cyanBlur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>

  <rect width="1280" height="720" fill="#101214"/>
  <rect x="24" y="18" width="1232" height="52" rx="16" fill="#15191D" stroke="url(#frame)" stroke-opacity=".8"/>
  <circle cx="50" cy="44" r="5" fill="#00FFFF"/>
  <text x="68" y="50" fill="#EAFBFF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">VASEY/DEV</text>
  <text x="1228" y="50" text-anchor="end" fill="#73909B" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="1.4">APPLICATION PREVIEW</text>

  <g clip-path="url(#viewportClip)">
    <rect x="24" y="82" width="1232" height="614" fill="#0A0E14"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#cyanGlow)"/>
    <rect x="24" y="82" width="1232" height="614" fill="url(#grid)"/>
    <circle cx="640" cy="280" r="230" fill="#00C8F0" opacity=".025" filter="url(#cyanBlur)"/>

    <g transform="translate(324 96)">
      <rect x="0" y="0" width="632" height="650" rx="28" fill="#0A0E14" fill-opacity=".42" stroke="#00C8F0" stroke-opacity=".06"/>
      <g transform="translate(574 13)">
        <rect width="44" height="44" rx="12" fill="#141A22" fill-opacity=".88" stroke="#00C8F0" stroke-opacity=".14"/>
        <path d="M12 15h20M12 22h20M12 29h20" stroke="#8899AA" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="316" y="30" text-anchor="middle" fill="#0090A8" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">VASEY/AI PRESENTS</text>
      <g transform="translate(131 52)">
        <g transform="translate(0 0)">
          <path d="M5 12h34v42H5zM13 4h34v42H13zM21 -4h34v42H21z" fill="#0F1319" stroke="#00C8F0" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M31 8l14 18M45 8 31 26" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
        </g>
        <text x="83" y="42" fill="url(#silver)" font-family="Arial Narrow, Inter, sans-serif" font-size="58" font-weight="800" letter-spacing="3">PAGE</text>
        <circle cx="249" cy="29" r="5" fill="#00E5FF"/>
        <circle cx="249" cy="29" r="15" fill="#00E5FF" opacity=".15" filter="url(#cyanBlur)"/>
        <text x="271" y="42" fill="url(#silver)" font-family="Arial Narrow, Inter, sans-serif" font-size="58" font-weight="800">X</text>
      </g>
      <text x="316" y="132" text-anchor="middle" fill="#8899AA" font-family="Inter, Arial, sans-serif" font-size="18">Extract. Paginate. Print.</text>
      <g transform="translate(126 149)">
        <circle cx="5" cy="7" r="4" fill="#00E5A0"/>
        <text x="18" y="11" fill="#556677" font-family="monospace" font-size="10" letter-spacing="1.4">CLIENT-SIDE · ZERO UPLOAD · OFFLINE-READY</text>
      </g>

      <g transform="translate(40 186)">
        <rect width="552" height="205" rx="17" fill="#0F1319" fill-opacity=".28" stroke="#006878" stroke-width="1.5" stroke-dasharray="7 6"/>
        <path d="M8 24V8h16M528 8h16v16M8 181v16h16M528 197h16v-16" fill="none" stroke="#0090A8" stroke-width="2" opacity=".7"/>
        <g transform="translate(248 27)" stroke="#00C8F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="0" width="56" height="56" rx="13" stroke-dasharray="5 4" opacity=".5"/>
          <path d="M28 16v24M17 26l11-11 11 11M16 44h24"/>
        </g>
        <text x="276" y="116" fill="#E8EDF3" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Drop or tap to upload</text>
        <text x="276" y="142" fill="#8899AA" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Oversized images, screenshots, PDFs, or DOCX</text>
        <g transform="translate(102 158)" font-family="monospace" font-size="10" text-anchor="middle">
          <rect width="58" height="27" rx="7" fill="#1A2230" stroke="#00C8F0" stroke-opacity=".08"/><text x="29" y="18" fill="#556677">PNG</text>
          <rect x="67" width="58" height="27" rx="7" fill="#1A2230" stroke="#00C8F0" stroke-opacity=".08"/><text x="96" y="18" fill="#556677">JPG</text>
          <rect x="134" width="66" height="27" rx="7" fill="#1A2230" stroke="#00C8F0" stroke-opacity=".08"/><text x="167" y="18" fill="#556677">WEBP</text>
          <rect x="209" width="58" height="27" rx="7" fill="#1A2230" stroke="#00C8F0" stroke-opacity=".08"/><text x="238" y="18" fill="#556677">PDF</text>
          <rect x="276" width="72" height="27" rx="7" fill="#1A2230" stroke="#00C8F0" stroke-opacity=".08"/><text x="312" y="18" fill="#556677">DOCX</text>
        </g>
      </g>

      <g transform="translate(40 420)">
        <text x="0" y="18" fill="#00C8F0" font-family="Arial Narrow, Inter, sans-serif" font-size="20" font-weight="800">/</text>
        <text x="17" y="18" fill="#8899AA" font-family="Arial Narrow, Inter, sans-serif" font-size="18" font-weight="800" letter-spacing="2">OUTPUT FORMAT</text>
        <rect x="0" y="34" width="270" height="118" rx="13" fill="#00C8F0" fill-opacity=".06" stroke="#00C8F0"/>
        <rect x="282" y="34" width="270" height="118" rx="13" fill="#141A22" stroke="#00C8F0" stroke-opacity=".08"/>
        <g transform="translate(113 49)">
          <rect width="44" height="52" rx="5" fill="none" stroke="#00C8F0" stroke-width="1.6"/><text x="22" y="31" text-anchor="middle" fill="#00C8F0" font-family="monospace" font-size="11" font-weight="700">PDF</text>
        </g>
        <text x="135" y="119" text-anchor="middle" fill="#00E5FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">PDF</text>
        <text x="135" y="138" text-anchor="middle" fill="#556677" font-family="Inter, Arial, sans-serif" font-size="11">Print-ready document</text>
        <g transform="translate(395 49)">
          <rect width="44" height="52" rx="5" fill="none" stroke="#00C8F0" stroke-width="1.6"/><text x="22" y="31" text-anchor="middle" fill="#00C8F0" font-family="monospace" font-size="9" font-weight="700">DOCX</text>
        </g>
        <text x="417" y="119" text-anchor="middle" fill="#8899AA" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">DOCX</text>
        <text x="417" y="138" text-anchor="middle" fill="#556677" font-family="Inter, Arial, sans-serif" font-size="11">Word document</text>
      </g>

      <g transform="translate(40 596)">
        <text x="0" y="18" fill="#00C8F0" font-family="Arial Narrow, Inter, sans-serif" font-size="20" font-weight="800">/</text>
        <text x="17" y="18" fill="#8899AA" font-family="Arial Narrow, Inter, sans-serif" font-size="18" font-weight="800" letter-spacing="2">PAGE SIZE</text>
        <rect x="160" y="0" width="392" height="32" rx="10" fill="#141A22" stroke="#00C8F0" stroke-opacity=".08"/>
        <text x="258" y="21" fill="#00E5FF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">US Letter · 8.5 × 11 in</text>
        <line x1="356" y1="7" x2="356" y2="25" stroke="#00C8F0" stroke-opacity=".12"/>
        <text x="453" y="21" fill="#8899AA" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle">A4 · 210 × 297 mm</text>
      </g>
    </g>
  </g>
  <rect x="24" y="82" width="1232" height="614" rx="22" fill="none" stroke="url(#frame)" stroke-opacity=".42" stroke-width="2"/>
</svg>
