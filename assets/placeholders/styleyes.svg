<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10c7d8"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="card6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="24" y="24" width="592" height="312" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="312" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none"/>

  <g clip-path="url(#roundClip)">
    <!-- Top bar -->
    <rect x="24" y="24" width="592" height="52" fill="#0d1219" opacity="0.9"/>
    <line x1="24" y1="76" x2="616" y2="76" stroke="#1a2736" stroke-width="1"/>

    <!-- App title in top bar -->
    <text x="48" y="57" fill="#e6f7ff" font-size="20" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">StyleyeS</text>
    <text x="160" y="57" fill="#9bdbe5" font-size="13" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">Prompt Engineering Studio</text>

    <!-- Version badge -->
    <rect x="530" y="40" width="66" height="22" rx="11" fill="url(#purpleAccent)" opacity="0.85"/>
    <text x="563" y="55" fill="#ffffff" font-size="11" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">v2.0.1</text>

    <!-- Style cards grid - Row 1 -->
    <rect x="48" y="96" width="120" height="80" rx="10" fill="url(#card1)" opacity="0.9"/>
    <rect x="48" y="96" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="108" y="196" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Vivid Warm</text>

    <rect x="183" y="96" width="120" height="80" rx="10" fill="url(#card2)" opacity="0.9"/>
    <rect x="183" y="96" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="243" y="196" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Neon Purple</text>

    <rect x="318" y="96" width="120" height="80" rx="10" fill="url(#card3)" opacity="0.9"/>
    <rect x="318" y="96" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="378" y="196" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Ocean Cyan</text>

    <rect x="453" y="96" width="120" height="80" rx="10" fill="url(#card4)" opacity="0.9"/>
    <rect x="453" y="96" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="513" y="196" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Emerald</text>

    <!-- Style cards grid - Row 2 -->
    <rect x="48" y="210" width="120" height="80" rx="10" fill="url(#card5)" opacity="0.9"/>
    <rect x="48" y="210" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="108" y="310" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Golden Hour</text>

    <rect x="183" y="210" width="120" height="80" rx="10" fill="url(#card6)" opacity="0.9"/>
    <rect x="183" y="210" width="120" height="80" rx="10" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <text x="243" y="310" fill="#c0d0dd" font-size="10" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Cool Blue</text>

    <rect x="318" y="210" width="120" height="80" rx="10" fill="#1a2736" opacity="0.8"/>
    <rect x="318" y="210" width="120" height="80" rx="10" fill="none" stroke="#10c7d8" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>
    <text x="378" y="255" fill="#4a6a7a" font-size="22" font-weight="300" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">+</text>

    <rect x="453" y="210" width="120" height="80" rx="10" fill="#1a2736" opacity="0.8"/>
    <rect x="453" y="210" width="120" height="80" rx="10" fill="none" stroke="#10c7d8" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>
    <text x="513" y="255" fill="#4a6a7a" font-size="22" font-weight="300" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">+</text>
  </g>
</svg>
