<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10c7d8"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="enhanceBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="outputGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="24" y="24" width="592" height="312" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="312" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none"/>

  <g clip-path="url(#roundClip)">
    <!-- Top bar -->
    <rect x="24" y="24" width="592" height="52" fill="#0d1219" opacity="0.9"/>
    <line x1="24" y1="76" x2="616" y2="76" stroke="#1a2736" stroke-width="1"/>

    <!-- App title -->
    <text x="48" y="57" fill="#e6f7ff" font-size="20" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">rePROMPT</text>
    <text x="160" y="57" fill="#9bdbe5" font-size="13" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">AI Prompt Enhancer</text>

    <!-- Version badge -->
    <rect x="530" y="40" width="66" height="22" rx="11" fill="url(#enhanceBtn)" opacity="0.85"/>
    <text x="563" y="55" fill="#ffffff" font-size="11" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">v1.2.0</text>

    <!-- Input label -->
    <text x="48" y="102" fill="#7fbfca" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">YOUR PROMPT</text>

    <!-- Input textarea -->
    <rect x="48" y="110" width="544" height="60" rx="8" fill="#0d1219" stroke="#1e3044" stroke-width="1"/>
    <text x="62" y="133" fill="#4a6a7a" font-size="13" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">A cat sitting on a windowsill at sunset...</text>
    <text x="62" y="153" fill="#4a6a7a" font-size="13" font-weight="400" font-family="'Inter','Segoe UI',sans-serif" opacity="0.5">with warm lighting</text>

    <!-- Enhance button -->
    <rect x="230" y="182" width="180" height="38" rx="19" fill="url(#enhanceBtn)"/>
    <text x="320" y="206" fill="#ffffff" font-size="14" font-weight="700" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Enhance Prompt</text>

    <!-- Decorative sparkle icons near button -->
    <circle cx="218" cy="201" r="2" fill="#a855f7" opacity="0.7"/>
    <circle cx="224" cy="192" r="1.5" fill="#22d3ee" opacity="0.6"/>
    <circle cx="416" cy="195" r="2" fill="#22d3ee" opacity="0.7"/>
    <circle cx="422" cy="204" r="1.5" fill="#a855f7" opacity="0.6"/>

    <!-- Output label -->
    <text x="48" y="244" fill="#7fbfca" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">ENHANCED OUTPUT</text>

    <!-- Output area with glow -->
    <rect x="48" y="252" width="544" height="72" rx="8" fill="url(#outputGlow)"/>
    <rect x="48" y="252" width="544" height="72" rx="8" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.4"/>
    <text x="62" y="274" fill="#c4b5fd" font-size="12" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">A photorealistic tabby cat perched on a sunlit wooden</text>
    <text x="62" y="292" fill="#c4b5fd" font-size="12" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">windowsill during golden hour, warm amber light casting</text>
    <text x="62" y="310" fill="#c4b5fd" font-size="12" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">soft shadows, bokeh background of a twilight cityscape...</text>
  </g>
</svg>
