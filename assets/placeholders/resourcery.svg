<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10c7d8"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="extractBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#10c7d8"/>
    </linearGradient>
    <linearGradient id="progressBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10c7d8"/>
      <stop offset="0.5" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#10c7d8"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="24" y="24" width="592" height="312" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="312" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none"/>

  <g clip-path="url(#roundClip)">
    <!-- Top bar -->
    <rect x="24" y="24" width="592" height="52" fill="#0d1219" opacity="0.9"/>
    <line x1="24" y1="76" x2="616" y2="76" stroke="#1a2736" stroke-width="1"/>

    <!-- App title -->
    <text x="48" y="57" fill="#e6f7ff" font-size="20" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">reSOURCERY</text>
    <text x="175" y="57" fill="#9bdbe5" font-size="13" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">Media Extraction Tool</text>

    <!-- Version badge -->
    <rect x="530" y="40" width="66" height="22" rx="11" fill="url(#extractBtn)" opacity="0.85"/>
    <text x="563" y="55" fill="#ffffff" font-size="11" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">v2.1.2</text>

    <!-- URL Input section -->
    <text x="48" y="102" fill="#7fbfca" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">SOURCE URL</text>

    <!-- URL input bar -->
    <rect x="48" y="110" width="440" height="38" rx="8" fill="#0d1219" stroke="#1e3044" stroke-width="1"/>
    <text x="62" y="134" fill="#4a6a7a" font-size="13" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">https://example.com/media/audio-track.mp3</text>

    <!-- Extract button -->
    <rect x="500" y="110" width="92" height="38" rx="8" fill="url(#extractBtn)"/>
    <text x="546" y="134" fill="#ffffff" font-size="13" font-weight="700" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Extract</text>

    <!-- Format options row -->
    <text x="48" y="174" fill="#7fbfca" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">FORMAT</text>

    <!-- Format chips -->
    <rect x="48" y="182" width="60" height="28" rx="14" fill="#10c7d8" opacity="0.2"/>
    <rect x="48" y="182" width="60" height="28" rx="14" fill="none" stroke="#10c7d8" stroke-width="1" opacity="0.6"/>
    <text x="78" y="200" fill="#10c7d8" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">MP3</text>

    <rect x="120" y="182" width="60" height="28" rx="14" fill="#1a2736"/>
    <text x="150" y="200" fill="#4a6a7a" font-size="12" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">WAV</text>

    <rect x="192" y="182" width="60" height="28" rx="14" fill="#1a2736"/>
    <text x="222" y="200" fill="#4a6a7a" font-size="12" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">FLAC</text>

    <rect x="264" y="182" width="60" height="28" rx="14" fill="#1a2736"/>
    <text x="294" y="200" fill="#4a6a7a" font-size="12" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">MP4</text>

    <rect x="336" y="182" width="60" height="28" rx="14" fill="#1a2736"/>
    <text x="366" y="200" fill="#4a6a7a" font-size="12" font-weight="500" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">WebM</text>

    <!-- Extraction result card -->
    <rect x="48" y="226" width="544" height="96" rx="10" fill="#0d1219" stroke="#1e3044" stroke-width="1"/>

    <!-- Result file info -->
    <text x="68" y="252" fill="#e6f7ff" font-size="14" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">audio-track.mp3</text>
    <text x="68" y="270" fill="#4a6a7a" font-size="11" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">128 kbps  ~  3.2 MB  ~  3:42</text>

    <!-- Progress bar -->
    <rect x="68" y="284" width="400" height="6" rx="3" fill="#1a2736"/>
    <rect x="68" y="284" width="320" height="6" rx="3" fill="url(#progressBar)"/>

    <!-- Download button -->
    <rect x="490" y="248" width="84" height="32" rx="16" fill="url(#extractBtn)"/>
    <text x="532" y="269" fill="#ffffff" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Download</text>

    <!-- Audio waveform decoration -->
    <rect x="68" y="300" width="3" height="10" rx="1.5" fill="#10c7d8" opacity="0.4"/>
    <rect x="75" y="296" width="3" height="18" rx="1.5" fill="#10c7d8" opacity="0.5"/>
    <rect x="82" y="299" width="3" height="12" rx="1.5" fill="#10c7d8" opacity="0.4"/>
    <rect x="89" y="294" width="3" height="22" rx="1.5" fill="#10c7d8" opacity="0.6"/>
    <rect x="96" y="298" width="3" height="14" rx="1.5" fill="#10c7d8" opacity="0.45"/>
    <rect x="103" y="296" width="3" height="18" rx="1.5" fill="#10c7d8" opacity="0.5"/>
    <rect x="110" y="300" width="3" height="10" rx="1.5" fill="#10c7d8" opacity="0.35"/>
    <rect x="117" y="293" width="3" height="24" rx="1.5" fill="#10c7d8" opacity="0.55"/>
    <rect x="124" y="297" width="3" height="16" rx="1.5" fill="#10c7d8" opacity="0.45"/>
    <rect x="131" y="295" width="3" height="20" rx="1.5" fill="#10c7d8" opacity="0.5"/>
  </g>
</svg>
