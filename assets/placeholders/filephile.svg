<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#121c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10c7d8"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
    <linearGradient id="tealBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#10c7d8"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="24" y="24" width="592" height="312" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="24" y="24" width="592" height="312" rx="18" stroke="url(#accent)" stroke-width="1.5" fill="none"/>

  <g clip-path="url(#roundClip)">
    <!-- Top bar -->
    <rect x="24" y="24" width="592" height="52" fill="#0d1219" opacity="0.9"/>
    <line x1="24" y1="76" x2="616" y2="76" stroke="#1a2736" stroke-width="1"/>

    <!-- App title -->
    <text x="48" y="57" fill="#e6f7ff" font-size="20" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">FilePhile</text>
    <text x="142" y="57" fill="#9bdbe5" font-size="13" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">File Generation Studio</text>

    <!-- Version badge -->
    <rect x="538" y="40" width="56" height="22" rx="11" fill="url(#tealBtn)" opacity="0.85"/>
    <text x="566" y="55" fill="#ffffff" font-size="11" font-weight="600" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">v1.0</text>

    <!-- Sidebar -->
    <rect x="24" y="76" width="140" height="260" fill="#0a0e13" opacity="0.95"/>
    <line x1="164" y1="76" x2="164" y2="336" stroke="#1a2736" stroke-width="1"/>

    <!-- Sidebar file type icons -->
    <!-- TXT -->
    <rect x="40" y="92" width="108" height="30" rx="6" fill="#1a2736"/>
    <rect x="48" y="98" width="18" height="18" rx="3" fill="#10c7d8" opacity="0.2"/>
    <text x="52" y="112" fill="#10c7d8" font-size="8" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">TXT</text>
    <text x="74" y="111" fill="#c0d0dd" font-size="11" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">Text File</text>

    <!-- MD -->
    <rect x="40" y="130" width="108" height="30" rx="6" fill="#10c7d8" opacity="0.15"/>
    <rect x="40" y="130" width="108" height="30" rx="6" fill="none" stroke="#10c7d8" stroke-width="1" opacity="0.5"/>
    <rect x="48" y="136" width="18" height="18" rx="3" fill="#10c7d8" opacity="0.3"/>
    <text x="53" y="149" fill="#10c7d8" font-size="8" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">MD</text>
    <text x="74" y="149" fill="#e6f7ff" font-size="11" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">Markdown</text>

    <!-- JSON -->
    <rect x="40" y="168" width="108" height="30" rx="6" fill="#1a2736"/>
    <rect x="48" y="174" width="18" height="18" rx="3" fill="#f59e0b" opacity="0.2"/>
    <text x="50" y="187" fill="#f59e0b" font-size="7" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">JSON</text>
    <text x="74" y="187" fill="#c0d0dd" font-size="11" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">JSON</text>

    <!-- CSV -->
    <rect x="40" y="206" width="108" height="30" rx="6" fill="#1a2736"/>
    <rect x="48" y="212" width="18" height="18" rx="3" fill="#34d399" opacity="0.2"/>
    <text x="51" y="225" fill="#34d399" font-size="8" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">CSV</text>
    <text x="74" y="225" fill="#c0d0dd" font-size="11" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">CSV</text>

    <!-- HTML -->
    <rect x="40" y="244" width="108" height="30" rx="6" fill="#1a2736"/>
    <rect x="48" y="250" width="18" height="18" rx="3" fill="#f43f5e" opacity="0.2"/>
    <text x="49" y="263" fill="#f43f5e" font-size="7" font-weight="700" font-family="'Inter','Segoe UI',sans-serif">HTML</text>
    <text x="74" y="263" fill="#c0d0dd" font-size="11" font-weight="500" font-family="'Inter','Segoe UI',sans-serif">HTML</text>

    <!-- Main content area - editor mockup -->
    <text x="184" y="102" fill="#7fbfca" font-size="12" font-weight="600" font-family="'Inter','Segoe UI',sans-serif">EDITOR</text>

    <!-- Editor area -->
    <rect x="184" y="112" width="412" height="145" rx="8" fill="#0d1219" stroke="#1e3044" stroke-width="1"/>

    <!-- Simulated markdown content lines -->
    <text x="200" y="135" fill="#10c7d8" font-size="12" font-weight="700" font-family="'Courier New',monospace"># Project README</text>
    <text x="200" y="155" fill="#7fbfca" font-size="11" font-weight="400" font-family="'Courier New',monospace">A brief description of the project</text>
    <text x="200" y="175" fill="#7fbfca" font-size="11" font-weight="400" font-family="'Courier New',monospace">and its core features.</text>
    <text x="200" y="200" fill="#10c7d8" font-size="12" font-weight="700" font-family="'Courier New',monospace">## Installation</text>
    <text x="200" y="220" fill="#4a6a7a" font-size="11" font-weight="400" font-family="'Courier New',monospace">npm install project-name</text>
    <text x="200" y="243" fill="#4a6a7a" font-size="11" font-weight="400" font-family="'Courier New',monospace" opacity="0.4">|</text>

    <!-- Bottom action bar -->
    <rect x="184" y="272" width="412" height="50" rx="8" fill="#0d1219" opacity="0.6"/>

    <!-- Generate button -->
    <rect x="420" y="282" width="160" height="32" rx="16" fill="url(#tealBtn)"/>
    <text x="500" y="303" fill="#ffffff" font-size="13" font-weight="700" font-family="'Inter','Segoe UI',sans-serif" text-anchor="middle">Generate File</text>

    <!-- File info -->
    <text x="200" y="302" fill="#4a6a7a" font-size="11" font-weight="400" font-family="'Inter','Segoe UI',sans-serif">readme.md  ~  142 bytes</text>
  </g>
</svg>
